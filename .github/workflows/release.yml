name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          # Wait for PyPI to index the release
          sleep 30

          PYPI_JSON=$(curl -s "https://pypi.org/pypi/gitfolio-cli/${VERSION}/json")
          TARBALL_URL=$(echo "$PYPI_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print([f for f in d['urls'] if f['packagetype']=='sdist'][0]['url'])")
          SHA256=$(echo "$PYPI_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print([f for f in d['urls'] if f['packagetype']=='sdist'][0]['digests']['sha256'])")

          git clone https://x-access-token:${TAP_TOKEN}@github.com/pranav-iiitdm/homebrew-tap.git
          cd homebrew-tap

          sed -i "s|url \".*\"|url \"${TARBALL_URL}\"|" gitfolio.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" gitfolio.rb

          git config user.email "parimipranav@gmail.com"
          git config user.name "gitfolio release bot"
          git add gitfolio.rb
          git commit -m "chore: update gitfolio to ${VERSION}"
          git push
