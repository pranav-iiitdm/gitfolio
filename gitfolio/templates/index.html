<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>gitfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 16px 24px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; font-weight: 600; color: #fff; }
    #push-btn { background: #2563eb; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    #push-btn:hover { background: #1d4ed8; }
    #push-btn:disabled { background: #374151; cursor: not-allowed; }
    .columns { display: flex; flex: 1; overflow: hidden; }
    .col { display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid #2a2a2a; }
    .col:last-child { border-right: none; }
    .col-pending { width: 220px; flex-shrink: 0; }
    .col-detail { flex: 1; }
    .col-done { width: 220px; flex-shrink: 0; }
    .col-header { padding: 12px 16px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #6b7280; border-bottom: 1px solid #2a2a2a; }
    .col-body { flex: 1; overflow-y: auto; padding: 8px; }
    .bullet-item { padding: 10px 12px; border-radius: 6px; margin-bottom: 4px; cursor: pointer; border: 1px solid transparent; font-size: 13px; line-height: 1.4; }
    .bullet-item:hover { background: #1f1f1f; }
    .bullet-item.active { background: #1e3a5f; border-color: #2563eb; }
    .bullet-item .meta { font-size: 11px; color: #6b7280; margin-top: 4px; }
    .tier2-badge { display: inline-block; background: #78350f; color: #fbbf24; font-size: 10px; padding: 1px 5px; border-radius: 3px; margin-left: 4px; }
    .detail-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #4b5563; font-size: 14px; }
    .detail-panel { padding: 24px; height: 100%; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
    .detail-meta { font-size: 12px; color: #6b7280; }
    .detail-bullet { font-size: 15px; line-height: 1.6; }
    .detail-bullet textarea { width: 100%; background: #1a1a1a; border: 1px solid #374151; color: #e0e0e0; padding: 10px; border-radius: 6px; font-size: 14px; line-height: 1.6; resize: vertical; min-height: 80px; font-family: inherit; }
    .detail-keywords { font-size: 12px; color: #9ca3af; }
    .detail-flag { font-size: 13px; color: #fbbf24; background: #1c1408; border: 1px solid #78350f; padding: 8px 12px; border-radius: 6px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn-approve { background: #15803d; color: #fff; }
    .btn-approve:hover { background: #166534; }
    .btn-edit { background: #1d4ed8; color: #fff; }
    .btn-edit:hover { background: #1e40af; }
    .btn-save { background: #15803d; color: #fff; }
    .btn-save:hover { background: #166534; }
    .btn-skip { background: #374151; color: #d1d5db; }
    .btn-skip:hover { background: #4b5563; }
    .btn-delete { background: #7f1d1d; color: #fca5a5; }
    .btn-delete:hover { background: #991b1b; }
    .btn-cancel { background: #374151; color: #d1d5db; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #1a1a1a; border: 1px solid #374151; color: #e0e0e0; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 100; display: none; }
  </style>
</head>
<body>
  <header>
    <h1>gitfolio</h1>
    <button id="push-btn" disabled onclick="pushToResume()">Push to resume →</button>
  </header>
  <div class="columns">
    <div class="col col-pending">
      <div class="col-header">Pending</div>
      <div class="col-body" id="pending-list"></div>
    </div>
    <div class="col col-detail">
      <div id="detail-pane"><div class="detail-empty">Select a bullet to review</div></div>
    </div>
    <div class="col col-done">
      <div class="col-header">Approved</div>
      <div class="col-body" id="approved-list"></div>
      <div class="col-header" style="border-top:1px solid #2a2a2a">Skipped / Deleted</div>
      <div class="col-body" id="done-list"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    let bullets = [], activeBullet = null, editMode = false;

    async function loadBullets() {
      const res = await fetch('/api/bullets');
      bullets = await res.json();
      render();
    }

    function render() {
      const pending = bullets.filter(b => b.status === 'pending');
      const approved = bullets.filter(b => b.status === 'approved');
      const done = bullets.filter(b => b.status === 'skipped' || b.status === 'deleted');
      document.getElementById('pending-list').innerHTML = pending.map(bulletItem).join('');
      document.getElementById('approved-list').innerHTML = approved.map(bulletItem).join('');
      document.getElementById('done-list').innerHTML = done.map(bulletItem).join('');
      document.getElementById('push-btn').disabled = approved.length === 0;
      if (activeBullet) {
        const updated = bullets.find(b => b.id === activeBullet.id);
        if (updated) { activeBullet = updated; renderDetail(); }
      }
    }

    function bulletItem(b) {
      const short = (b.bullet || '').slice(0, 60) + ((b.bullet || '').length > 60 ? '…' : '');
      const t2 = b.tier === 2 ? '<span class="tier2-badge">T2</span>' : '';
      const active = activeBullet && activeBullet.id === b.id ? ' active' : '';
      return `<div class="bullet-item${active}" onclick="selectBullet('${b.id}')">${short}${t2}<div class="meta">${(b.cluster||{}).work_type||''} · ${(b.score||0).toFixed(0)}</div></div>`;
    }

    function selectBullet(id) {
      activeBullet = bullets.find(b => b.id === id);
      editMode = false;
      renderDetail();
    }

    function renderDetail() {
      if (!activeBullet) return;
      const b = activeBullet, c = b.cluster || {};
      const flagHtml = b.tier === 2 && b.flag_reason ? `<div class="detail-flag">⚠️ ${b.flag_reason}</div>` : '';
      const kwHtml = b.keywords && b.keywords.length ? `<div class="detail-keywords">Keywords: ${b.keywords.join(', ')}</div>` : '';
      const bulletContent = editMode
        ? `<div class="detail-bullet"><textarea id="edit-text">${b.bullet||''}</textarea></div>`
        : `<div class="detail-bullet">${b.bullet||''}</div>`;
      const actions = editMode
        ? `<div class="actions"><button class="btn btn-save" onclick="saveEdit()">Save & Approve</button><button class="btn btn-cancel" onclick="cancelEdit()">Cancel</button></div>`
        : `<div class="actions"><button class="btn btn-approve" onclick="updateBullet('${b.id}','approved')">✓ Approve</button><button class="btn btn-edit" onclick="startEdit()">Edit</button><button class="btn btn-skip" onclick="updateBullet('${b.id}','skipped')">Skip</button><button class="btn btn-delete" onclick="updateBullet('${b.id}','deleted')">Delete</button></div>`;
      document.getElementById('detail-pane').innerHTML = `<div class="detail-panel"><div class="detail-meta">${c.repo||''} · ${c.work_type||''} · score ${(b.score||0).toFixed(0)}<br>PR: ${c.pr_title||''}</div>${bulletContent}${flagHtml}${kwHtml}${actions}</div>`;
    }

    function startEdit() { editMode = true; renderDetail(); document.getElementById('edit-text').focus(); }
    function cancelEdit() { editMode = false; renderDetail(); }

    async function saveEdit() {
      const text = document.getElementById('edit-text').value.trim();
      await fetch(`/api/bullets/${activeBullet.id}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({status:'approved', bullet: text}) });
      editMode = false;
      await loadBullets();
      showToast('Saved and approved');
    }

    async function updateBullet(id, status) {
      await fetch(`/api/bullets/${id}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({status}) });
      if (activeBullet && activeBullet.id === id) {
        activeBullet = null;
        document.getElementById('detail-pane').innerHTML = '<div class="detail-empty">Select a bullet to review</div>';
      }
      await loadBullets();
      showToast(status === 'approved' ? '✓ Approved' : status === 'skipped' ? 'Skipped' : 'Deleted');
    }

    async function pushToResume() {
      const btn = document.getElementById('push-btn');
      btn.disabled = true; btn.textContent = 'Pushing…';
      try {
        const res = await fetch('/api/push', { method: 'POST' });
        const data = await res.json();
        showToast(res.ok ? `✓ Pushed ${data.injected} bullet(s) — check your inbox` : 'Error: ' + (data.error||'unknown'));
        if (res.ok) await loadBullets();
      } catch(e) { showToast('Error: ' + e.message); }
      btn.textContent = 'Push to resume →';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    loadBullets();
  </script>
</body>
</html>
